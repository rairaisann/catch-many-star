<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Solana Star Catcher</title>
<style>
  :root { --purple:#9945FF; --green:#14F195; --bg:#120a24; --bg2:#1d0f3d; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:#fff;
    font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif; touch-action:manipulation; user-select:none; -webkit-user-select:none; }
  #app { display:flex; flex-direction:column; height:100%; max-width:720px; margin:0 auto; }
  header { padding:12px 16px 10px; text-align:center; border-bottom:2px solid var(--purple);
    background:linear-gradient(180deg,var(--bg2),var(--bg)); }
  h1 { margin:0 0 8px; font-size:clamp(1.3rem,5vw,1.9rem); letter-spacing:.02em;
    background:linear-gradient(90deg,var(--purple),var(--green)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .stats { display:flex; justify-content:center; gap:12px; }
  .stat { flex:1; max-width:180px; padding:6px 10px; border-radius:10px; border:1.5px solid var(--purple); background:rgba(153,69,255,.15); }
  .stat span { display:block; font-size:.75rem; opacity:.8; }
  .stat b { font-size:1.5rem; color:var(--green); font-variant-numeric:tabular-nums; }
  .stat.low b { color:#ff6b8a; }
  #field { position:relative; flex:1; overflow:hidden; cursor:crosshair;
    background:radial-gradient(ellipse at 50% 120%,rgba(153,69,255,.35),transparent 60%), var(--bg); }
  .star { position:absolute; top:0; left:0; border:0; padding:0; background:none; cursor:pointer; will-change:transform; touch-action:manipulation; }
  .star svg { width:100%; height:100%; display:block; filter:drop-shadow(0 0 8px currentColor); }
  .pop { position:absolute; pointer-events:none; font-weight:700; color:var(--green); animation:pop .6s ease-out forwards; }
  @keyframes pop { to { transform:translateY(-40px); opacity:0; } }
  #overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    background:rgba(18,10,36,.88); text-align:center; padding:24px; z-index:5; }
  #overlay.hidden { display:none; }
  #overlay h2 { margin:0; font-size:1.6rem; }
  #overlay p { margin:0; opacity:.85; line-height:1.6; }
  #final { font-size:3rem; font-weight:800; color:var(--green); }
  button.main { font:inherit; font-size:1.2rem; font-weight:700; color:#120a24; border:0; border-radius:999px; padding:14px 40px; cursor:pointer;
    background:linear-gradient(90deg,var(--green),#7bf5c8); box-shadow:0 0 0 3px var(--purple), 0 6px 24px rgba(153,69,255,.5); }
  button.main:active { transform:scale(.96); }
  button:focus-visible { outline:3px solid var(--green); outline-offset:3px; }
  @media (prefers-reduced-motion:reduce) { .pop { animation-duration:.01s; } }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Solana Star Catcher</h1>
    <div class="stats">
      <div class="stat"><span>スコア</span><b id="score">0</b></div>
      <div class="stat" id="timeBox"><span>残り時間</span><b id="time">30</b></div>
    </div>
  </header>
  <main id="field">
    <div id="overlay">
      <h2 id="ovTitle">星をつかまえよう！</h2>
      <p id="ovText">落ちてくる星をタップ／クリック。<br>緑の星は1点、紫の星は3点。制限時間は30秒！</p>
      <div id="final" hidden></div>
      <button class="main" id="startBtn">スタート</button>
    </div>
  </main>
</div>
<script>
(() => {
  const DURATION = 30;
  const field = document.getElementById('field');
  const overlay = document.getElementById('overlay');
  const scoreEl = document.getElementById('score');
  const timeEl = document.getElementById('time');
  const timeBox = document.getElementById('timeBox');
  const startBtn = document.getElementById('startBtn');
  const ovTitle = document.getElementById('ovTitle');
  const ovText = document.getElementById('ovText');
  const finalEl = document.getElementById('final');
  const STAR_PATH = 'M12 1.5l3 7.2 7.7.6-5.9 5 1.8 7.6L12 17.9 5.4 21.9l1.8-7.6-5.9-5 7.7-.6z';

  let stars = [], score = 0, running = false, endAt = 0, lastSpawn = 0, last = 0, best = 0;

  function spawn() {
    const w = field.clientWidth;
    const big = Math.random() < 0.2; // 紫の星: 高得点・小さめ・速い
    const size = big ? 36 + Math.random() * 10 : 46 + Math.random() * 22;
    const btn = document.createElement('button');
    btn.className = 'star';
    btn.setAttribute('aria-label', '星');
    btn.style.width = btn.style.height = size + 'px';
    btn.style.color = big ? '#9945FF' : '#14F195';
    btn.innerHTML = '<svg viewBox="0 0 24 24"><path d="' + STAR_PATH + '" fill="currentColor"/></svg>';
    const s = { el: btn, x: Math.random() * (w - size), y: -size, size,
      vy: (big ? 260 : 150) + Math.random() * 90, pts: big ? 3 : 1, rot: Math.random() * 40 - 20, dead: false };
    const hit = e => { e.preventDefault(); e.stopPropagation(); catchStar(s); };
    btn.addEventListener('pointerdown', hit);
    field.appendChild(btn);
    stars.push(s);
  }

  function catchStar(s) {
    if (!running || s.dead) return;
    s.dead = true;
    score += s.pts;
    scoreEl.textContent = score;
    const p = document.createElement('div');
    p.className = 'pop';
    p.textContent = '+' + s.pts;
    p.style.left = (s.x + s.size / 2 - 10) + 'px';
    p.style.top = s.y + 'px';
    field.appendChild(p);
    setTimeout(() => p.remove(), 650);
    s.el.remove();
  }

  function loop(t) {
    if (!running) return;
    const dt = Math.min((t - last) / 1000, 0.05);
    last = t;
    const remain = Math.max(0, (endAt - t) / 1000);
    timeEl.textContent = Math.ceil(remain);
    timeBox.classList.toggle('low', remain <= 5);
    if (remain <= 0) return finish();

    const interval = 520 - (1 - remain / DURATION) * 220; // だんだん増える
    if (t - lastSpawn > interval) { spawn(); lastSpawn = t; }

    const h = field.clientHeight;
    stars = stars.filter(s => {
      if (s.dead) return false;
      s.y += s.vy * dt;
      if (s.y > h) { s.el.remove(); return false; }
      s.el.style.transform = 'translate(' + s.x + 'px,' + s.y + 'px) rotate(' + (s.rot + s.y * 0.2) + 'deg)';
      return true;
    });
    requestAnimationFrame(loop);
  }

  function start() {
    stars.forEach(s => s.el.remove());
    stars = []; score = 0; scoreEl.textContent = 0; timeEl.textContent = DURATION;
    timeBox.classList.remove('low');
    overlay.classList.add('hidden');
    running = true;
    const now = performance.now();
    endAt = now + DURATION * 1000; last = now; lastSpawn = now;
    requestAnimationFrame(loop);
  }

  function finish() {
    running = false;
    stars.forEach(s => s.el.remove());
    stars = [];
    timeEl.textContent = 0;
    const newBest = score > best;
    if (newBest) best = score;
    ovTitle.textContent = newBest && score > 0 ? '🎉 ハイスコア！' : 'タイムアップ！';
    ovText.innerHTML = 'あなたのスコア<br><small>ベスト: ' + best + '</small>';
    finalEl.textContent = score;
    finalEl.hidden = false;
    startBtn.textContent = 'もう一度';
    overlay.classList.remove('hidden');
  }

  startBtn.addEventListener('click', start);
})();
</script>
</body>
</html>
